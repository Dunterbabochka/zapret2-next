name: Проблема со стратегиями
description: Сообщить, что не работает, и приложить автоматический отчёт
title: "[Стратегии]: "
labels: [strategy-report]
body:
  - type: markdown
    attributes:
      value: |
        Если ни одна стратегия не подошла, откройте service.bat → 13. Run Diagnostics → 2. Create support report (automatic).
        После проверки приложите готовый ZIP из runtime/support-reports. Подробные локальные логи прикладывать не нужно.
  - type: input
    id: provider
    attributes:
      label: Провайдер
      placeholder: Название провайдера
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Область или город
      description: Необязательно, но помогает сопоставлять результаты в разных сетях.
      placeholder: Область или город
  - type: textarea
    id: problem
    attributes:
      label: Что не работает?
      placeholder: Например, YouTube не открывается ни с одной стратегией; Discord работает.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Автоматический отчёт
      description: Перетащите сюда созданный ZIP из runtime/support-reports. Если отчёт не создался, напишите, на каком шаге остановилась проверка.
  - type: input
    id: version
    attributes:
      label: Версия сборки и Windows
      description: Можно пропустить, если приложили отчёт — версии уже есть в нём.
  - type: dropdown
    id: strategy
    attributes:
      label: Стратегия
      options: [Ни одна не подошла, general, ALT, ALT3, ALT5, ALT11, ALT12, ALT13, EXP, FAKE TLS AUTO ALT2, NEXT SAFE, NEXT BALANCED]
